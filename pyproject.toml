[project]
name = "lan-a2a"
version = "0.1.0"
description = "A2A (Agent-to-Agent) gateway for agents on the internal LAN, built on crewAI's a2a extra and a2a-sdk."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "a2a-sdk~=0.3.10",
    "fastapi",
    "uvicorn",
    "httpx",
    "crewai[a2a]",
]

[project.scripts]
lan-a2a = "lan_a2a.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lan_a2a"]
